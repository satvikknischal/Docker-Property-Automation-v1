services:
  nginx-proxy-manager:
    image: docker.io/jc21/nginx-proxy-manager:${NPM_VERSION}
    container_name: nginx-proxy-manager
    restart: unless-stopped
    # Deliberately NOT `env_file: ../.env` — this image honors PUID/PGID (unlike
    # most non-linuxserver images), and the shared .env sets those for the media
    # services. If NPM inherits them it drops to a non-root user and can't write
    # ./data/logs (which Docker creates as root on first run) — nginx then fails
    # with "user directive ... ignored" + "fallback_error.log ... Permission
    # denied" and crash-loops. NPM only ever needed TZ, which is explicit below.
    environment:
      - TZ=${TZ}
       #TZ might not be needed, remove it if it causes issues
    ports:
      - '${NPM_HTTP_PORT}:80'
      - '${NPM_ADMIN_PORT}:81'
      - '${NPM_HTTPS_PORT}:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.docker.compose.project=nginx-proxy-manager"
      - "com.docker.compose.service=nginx-proxy-manager"

networks:
  proxy-network:
    external: true
